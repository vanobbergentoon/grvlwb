<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>GRVLWB Routeplanner</title>

    <link rel="stylesheet"
        href="httpset.css

    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        #map {
            flex: 1;
        }

        #sidebar {
            width: 320px;
            background: #f4f4f4;
            border-left: 1px solid #ccc;
            padding: 15px;
            overflow-y: auto;
        }

        h2 {
            margin-top: 0;
        }

        ul {
            padding-left: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div id="sidebar">

        <h2>GRVLWB</h2>

        <p>
            Totale afstand:
            <strong id="distance">0.00 km</strong>
        </p>

        <h3>Segmenten</h3>

        <ul id="segments"></ul>

        <button onclick="downloadGPX()">
            Download GPX
        </button>

    </div>

    <script src="https://unet@1.9.4/dist/leaflet.jsscript>

    <script>

        let selectedSegments = [];
        let totalDistance = 0;

        const map = L.map('map').setView([51.22, 4.40], 10);

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19
            }
        ).addTo(map);

        fetch('GRVLWB.geojson')
            .then(response => response.json())
            .then(data => {

                const geoLayer = L.geoJSON(data, {

                    style: {
                        color: 'blue',
                        weight: 4
                    },

                    onEachFeature: function (feature, layer) {

                        layer.on('click', function () {

                            const id = feature.properties.OBJECTID;
                            const len = Number(feature.properties.Field || 0);

                            const index =
                                selectedSegments.findIndex(
                                    s => s.id === id
                                );

                            if (index === -1) {

                                selectedSegments.push({
                                    id: id,
                                    feature: feature
                                });

                                layer.setStyle({
                                    color: 'lime'
                                });

                                totalDistance += len;

                            } else {

                                selectedSegments.splice(index, 1);

                                layer.setStyle({
                                    color: 'blue'
                                });

                                totalDistance -= len;
                            }

                            updatePanel();

                        });

                    }

                }).addTo(map);

                map.fitBounds(geoLayer.getBounds());

            });

        function updatePanel() {

            document.getElementById('distance').innerHTML =
                totalDistance.toFixed(2) + " km";

            const list =
                document.getElementById('segments');

            list.innerHTML = '';

            selectedSegments.forEach(seg => {

                const li = document.createElement('li');

                li.innerHTML =
                    seg.feature.properties.Name +
                    ' (' +
                    Number(seg.feature.properties.Field).toFixed(1) +
                    ' km)';

                list.appendChild(li);

            });

        }

        function downloadGPX() {

            let gpx =
                `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="GRVLWB">
<trk>
<name>GRVLWB Route</name>
<trkseg>
`;

            selectedSegments.forEach(seg => {

                seg.feature.geometry.coordinates.forEach(c => {

                    gpx += `<trkpt lat="${c[1]}" lon="${c[0]}"></trkpt>\n`;

                });

            });

            gpx += `
</trkseg>
</trk>
</gpx>`;

            const blob =
                new Blob(
                    [gpx],
                    { type: 'application/gpx+xml' }
                );

            const a =
                document.createElement('a');

            a.href =
                URL.createObjectURL(blob);

            a.download =
                'GRVLWB_route.gpx';

            a.click();

        }

    </script>

</body>

</html>
