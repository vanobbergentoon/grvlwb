function add(ei,from,auto,g){R.push({e:ei,from,to:other(ei,from),auto,g})}
function step(ei,pt){const g=++gid;if(start===null){const e=E[ei];const da=Math.hypot(e.p[0][0]-pt[0],e.p[0][1]-pt[1]),db=Math.hypot(e.p.at(-1)[0]-pt[0],e.p.at(-1)[1]-pt[1]);start=da<=db?e.a:e.b;add(ei,start,false,g);return}
const c=cur();if(E[ei].a===c||E[ei].b===c){add(ei,c,false,g);return}
if(!$('auto').checked){msg('Dit segment sluit niet aan. Kies een gestippeld segment of zet automatisch verbinden aan.');return}
const e=E[ei],ds=[e.a,e.b].map(n=>[n,path(c,n)]).filter(x=>x[1]).sort((x,y)=>x[1].reduce((s,t)=>s+E[t[0]].km,0)-y[1].reduce((s,t)=>s+E[t[0]].km,0));
if(!ds.length){msg('Geen verbinding gevonden.');return}
const[n,pp]=ds[0];pp.forEach(([k,f])=>add(k,f,true,g));add(ei,n,false,g)}
function msg(t){$('msg').textContent=t}
function orient(r){const e=E[r.e];return e.a===r.from?e.p:[...e.p].reverse()}
function gpx(){const nm=$('name').value.trim()||'Gravelweb route',pts=[];R.forEach((r,i)=>{const p=orient(r);pts.push(...(i?p.slice(1):p))});
const x=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
return`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Gravelweb" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${x(nm)}</name><desc>${x(R.map(r=>E[r.e].lab).join(', '))}</desc><trkseg>\n${pts.map(p=>`<trkpt lat="${p[3]}" lon="${p[2]}"/>`).join('\n')}\n</trkseg></trk></gpx>`}
async function save(){const nm=($('name').value.trim()||'Gravelweb route').replace(/[^\w\- ]+/g,'').trim()||'route',fn=nm+'.gpx';
try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([gpx()],{type:'application/gpx+xml'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);msg('GPX gedownload.')}catch(e){$('det').open=true;msg('Downloaden lukte niet. Gebruik "Kopieer GPX".')}}
async function share(){const nm=($('name').value.trim()||'route').replace(/[^\w\- ]+/g,'').trim()||'route',f=new File([gpx()],nm+'.gpx',{type:'application/gpx+xml'});try{await navigator.share({files:[f],title:nm})}catch(e){}}
async function copy(){const t=gpx();try{await navigator.clipboard.writeText(t);msg('GPX gekopieerd. Plak het in een tekstbestand met de naam route.gpx.')}catch(e){$('det').open=true;$('gx').select();document.execCommand&&document.execCommand('copy');msg('Tekst geselecteerd: kopieer die handmatig.')}}
function ui(){const km=R.reduce((s,r)=>s+E[r.e].km,0),cnt={};R.forEach(r=>cnt[r.e]=(cnt[r.e]||0)+1);const dub=Object.values(cnt).filter(v=>v>1).length;
$('km').textContent=fmt(km);$('sub').textContent=R.length?`${R.length} segmenten${dub?` · ${dub} dubbel`:''}${cur()===start?' · lus gesloten':''}`:'';
const got={};Object.keys(cnt).forEach(k=>{const e=E[k];if(!e.lk)got[e.o]=(got[e.o]||0)+1});const full=Object.keys(got).filter(o=>got[o]>=PIECES[o]).length;
$('cov').style.width=100*full/TOT+'%';$('covt').textContent=`${full} van ${TOT} segmenten gedekt`;
$('hint').textContent=!R.length?'Klik op een segment om te starten. Het startpunt is het uiteinde dat het dichtst bij je klik ligt.':'Klik op een segment met streepjeslijn om door te gaan. Een ander segment verbind ik via de kortste weg.';
$('steps').innerHTML=R.map(r=>{const e=E[r.e];return`<li style="border-left:4px solid ${e.c};padding-left:8px" class="${r.auto?'auto':''} ${cnt[r.e]>1?'dub':''}"><span>${e.nm}</span><span>${fmt(e.km)} km</span></li>`}).join('');$('steps').scrollTop=1e9;
['undo','loop','rev','clr','dl','cp'].forEach(i=>$(i).disabled=!R.length);$('loop').disabled=!R.length||cur()===start;
$('gx').value=R.length?gpx():'';draw()}
const map=L.map('map',{preferCanvas:true,zoomSnap:.5});
const TF_KEY='';/* optioneel: gratis Thunderforest-sleutel voor de Outdoors-kaart */
const lay={'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-bijdragers'}),'OpenTopoMap (outdoor)':L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap-bijdragers, SRTM | © OpenTopoMap (CC-BY-SA)'}),
'CyclOSM (fiets)':L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap-bijdragers | CyclOSM'})};
if(TF_KEY)lay['Outdoors (Thunderforest)']=L.tileLayer('https://{s}.tile.thunderforest.com/outdoors/{z}/{x}/{y}.png?apikey='+TF_KEY,{maxZoom:22,attribution:'© Thunderforest, © OpenStreetMap-bijdragers'});
lay['OpenStreetMap'].addTo(map);L.control.layers(lay,null,{collapsed:true}).addTo(map);
E.forEach(e=>e.ll=e.p.map(p=>[p[3],p[2]]));
const bounds=L.latLngBounds(E.flatMap(e=>e.ll)),fit=()=>map.fitBounds(bounds,{padding:[20,20]});
const net=L.layerGroup().addTo(map),cand=L.layerGroup().addTo(map),rt=L.layerGroup().addTo(map),hitg=L.layerGroup().addTo(map);
E.forEach((e,i)=>{L.polyline(e.ll,{color:'#fff',weight:e.w+2.5,opacity:.8,interactive:false}).addTo(net);L.polyline(e.ll,{color:e.c,weight:e.w,opacity:.95,dashArray:e.lk?'4 6':null,interactive:false}).addTo(net);
const h=L.polyline(e.ll,{weight:22,opacity:.001}).addTo(hitg);h.bindTooltip(e.lk?`${e.nm} · ${Math.round(e.km*1000)} m`:`${e.nm} · ${e.pct}% onverhard · ${fmt(e.km)} km`,{sticky:true});
h.on('click',ev=>{L.DomEvent.stopPropagation(ev);step(i,[ev.latlng.lng*CL*111.32,ev.latlng.lat*110.57]);ui()});
});
const ll=n=>[NODE[n][3],NODE[n][2]],dotm=(n,c)=>L.circleMarker(ll(n),{radius:9,color:'#fff',weight:3,fillColor:c,fillOpacity:1,interactive:false}).addTo(rt);
function draw(){cand.clearLayers();rt.clearLayers();const c=cur();
if(c!==null)INC[c].forEach(i=>{L.polyline(E[i].ll,{color:'#fff',weight:E[i].w+6,opacity:.9,interactive:false}).addTo(cand);L.polyline(E[i].ll,{color:E[i].c,weight:E[i].w+2,dashArray:'9 8',lineCap:'butt',interactive:false}).addTo(cand)});
R.forEach(r=>{const l=orient(r).map(p=>[p[3],p[2]]);L.polyline(l,{color:'#fff',weight:E[r.e].w+7,interactive:false}).addTo(rt);L.polyline(l,{color:E[r.e].cl,weight:E[r.e].w+3.5,interactive:false}).addTo(rt)});
if(start!==null){dotm(start,'#0E8A5F');if(c!==start)dotm(c,'#1B4DFF')}
hitg.eachLayer(l=>l.bringToFront())}
$('undo').onclick=()=>{const g=R.at(-1).g;while(R.length&&R.at(-1).g===g)R.pop();if(!R.length)start=null;ui()};
$('clr').onclick=()=>{R=[];start=null;msg('');ui()};
$('rev').onclick=()=>{const c=cur();R=R.reverse().map(r=>({...r,from:r.to,to:r.from}));start=c;ui()};
$('loop').onclick=()=>{const p=path(cur(),start);if(!p){msg('Geen terugweg gevonden.');return}const g=++gid;p.forEach(([k,f])=>add(k,f,true,g));ui()};
$('chips').innerHTML=CLS.map(c=>`<span class="chip"><i style="background:${c[1]}"></i>${c[3]}</span>`).join('')+'<span class="chip"><i style="background:repeating-linear-gradient(90deg,#6B7280 0 4px,transparent 4px 8px)"></i>koppelstuk</span>';if(innerWidth<=760)$('leg').open=false;$('dl').onclick=save;$('sh').onclick=share;if(navigator.canShare&&/iPhone|iPad|Android/.test(navigator.userAgent))$('sh').hidden=false;$('cp').onclick=copy;
function load(seq,st){R=[];start=st;let c=start;const g=++gid;seq.forEach(i=>{add(i,c,false,g);c=R.at(-1).to});fit();ui()}
D.l.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.n;$('demo').appendChild(o)});
$('demo').onchange=e=>{if(e.target.value!==''){const l=D.l[+e.target.value],idx={};E.forEach((x,i)=>idx[x.id]=i);load(l.s.map(id=>idx[id]),l.st);$('name').value='Gravelweb '+l.n.split(' · ')[0];e.target.value=''}};
fit();ui();setTimeout(()=>map.invalidateSize(),300);addEventListener('resize',()=>map.invalidateSize());
</script></body></html>
