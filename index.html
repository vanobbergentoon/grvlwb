<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <title>Test</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        #map {
            height: 100vh;
        }
    </style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<cript>

var map = L.map('map').setView([51.22, 4.40], 10);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

</script>

</body>
</html>
